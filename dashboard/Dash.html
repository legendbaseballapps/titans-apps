<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><base target="_top">

<title>Titans Coaches Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Public+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: navy app bar + filter bar, then cards on a cool grey ground; one look (light), matching the live dashboard and the deck mockup. */
:root {
  --navy: #14213D; --navy-2: #22345A; --blue: #2B6CB0; --sky: #8FB8E8; --orange: #C85C1C; --orange-soft: #FDF0E7;
  --green: #1F7A4A; --red: #C0392B; --ground: #ECEFF4; --card: #FFFFFF; --line: #D6DCE5; --soft: #F4F6F9; --ink: #16233A; --muted: #5A6781; --faint: #8A93A6;
  --display: 'Oswald', 'Arial Narrow', Arial, sans-serif; --body: 'Public Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { background: var(--ground); color: var(--ink); font-family: var(--body); font-size: 14px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--navy); }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1280px; margin: 0 auto; }
button { font: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* app bar */
.bar { background: var(--navy); color: #fff; padding-block: 12px; }
.bar .wrap { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; }
.mark { width: 46px; height: 32px; border-radius: 7px; background: #fff; color: var(--navy); font-family: var(--display); font-weight: 600; font-size: 19px; display: grid; place-items: center; letter-spacing: -.5px; }
.brand b { display: block; font-family: var(--display); font-weight: 600; font-size: 20px; letter-spacing: 1.5px; line-height: 1.05; text-transform: uppercase; }
.brand span { display: block; font-size: 11px; letter-spacing: 2.2px; text-transform: uppercase; color: #C9D3E3; }
.nav { display: flex; gap: 4px; background: var(--navy-2); border-radius: 9px; padding: 4px; flex-wrap: wrap; }
.nav button { background: transparent; border: 0; color: #DCE4F0; font-family: var(--display); font-weight: 500; font-size: 15px; letter-spacing: 1.4px; text-transform: uppercase; padding: 7px 14px; border-radius: 6px; }
.nav button[aria-selected="true"] { background: var(--orange); color: #fff; }
.who { margin-left: auto; text-align: right; font-size: 12px; color: #C9D3E3; line-height: 1.3; }
.who b { color: #fff; }

/* filter bar */
.filters { background: var(--card); border-bottom: 1px solid var(--line); padding-block: 10px; }
.filters .wrap { display: flex; align-items: center; gap: 10px 22px; flex-wrap: wrap; }
.fg { display: flex; align-items: center; gap: 10px; }
.fg > span { font-size: 11px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted); }
.seg { display: flex; background: var(--soft); border: 1px solid var(--line); border-radius: 8px; padding: 3px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; color: var(--ink); font-weight: 600; font-size: 13.5px; padding: 6px 12px; border-radius: 6px; }
.seg button[aria-pressed="true"] { background: var(--navy); color: #fff; }
.seg button:disabled { color: var(--faint); cursor: not-allowed; }
.asof { margin-left: auto; font-size: 12.5px; color: var(--muted); }
.subnav { display: flex; gap: 2px; margin-right: 8px; flex-wrap: wrap; }
.subnav button { border: 0; background: transparent; color: var(--muted); font-family: var(--display); font-weight: 500; font-size: 16px; letter-spacing: 1.2px; text-transform: uppercase; padding: 6px 12px; border-bottom: 3px solid transparent; }
.subnav button[aria-selected="true"] { color: var(--navy); border-bottom-color: var(--orange); }
.subnav .crumb { font-family: var(--display); font-weight: 600; font-size: 16px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--orange); padding: 6px 10px 6px 0; border-right: 1px solid var(--line); margin-right: 6px; align-self: center; }
.roster { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.pcard { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; color: var(--ink); }
.pcard:hover { border-color: var(--navy); }
.pcard b { display: block; font-size: 14px; }
.pcard span { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
.pcard.idle b { color: var(--muted); }
.lvhead { font-family: var(--display); font-weight: 600; font-size: 18px; letter-spacing: 1px; text-transform: uppercase; color: var(--navy); margin: 6px 0 8px; }

main { padding-block: 18px 40px; }
.sample { display: inline-block; background: var(--orange-soft); color: var(--orange); font-weight: 700; font-size: 12px; padding: 4px 10px; border-radius: 12px; }
h1 { font-family: var(--display); font-weight: 600; font-size: 32px; letter-spacing: .3px; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 4px 0 0; }
.titlerow { display: flex; align-items: flex-end; gap: 10px 18px; flex-wrap: wrap; margin-bottom: 14px; }
.titlerow .key { margin-left: auto; display: flex; gap: 14px; align-items: center; font-size: 12.5px; color: var(--muted); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; min-width: 0; }
.card h2 { font-size: 12px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; color: var(--navy); margin: 0 0 10px; display: flex; gap: 10px; align-items: baseline; }
.card h2 small { margin-left: auto; font-size: 12px; font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--muted); }
.stack { display: grid; gap: 14px; }
.cols { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 900px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.mbar.qbar { grid-template-columns: minmax(0, 230px) minmax(0, 1fr) 36px; }
@media (max-width: 600px) { .mbar.qbar { grid-template-columns: minmax(0, 1fr) 36px; row-gap: 4px; } .mbar.qbar .btrack { grid-column: 1 / -1; grid-row: 2; } }

/* markers: met = filled green check, not yet = heavy navy ring (same as the cards) */
.ok, .ring { display: inline-block; width: 18px; height: 18px; border-radius: 50%; vertical-align: middle; flex: none; }
.ok { background: var(--green); color: #fff; font-size: 12px; font-weight: 700; line-height: 18px; text-align: center; }
.ok::before { content: "\2713"; }
.ring { border: 3px solid var(--navy); }
.sm .ok, .sm .ring, .ok.sm, .ring.sm { width: 14px; height: 14px; }
.ok.sm { font-size: 9px; line-height: 14px; }
.ring.sm { border-width: 2.5px; }

/* 150 banner */
.counter { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px 28px; align-items: center; background: var(--navy); color: #fff; border: 0; }
.counter .lab { font-size: 11.5px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; color: #F2B33D; }
.counter .big { font-family: var(--display); font-weight: 600; font-size: 64px; line-height: 1; color: #fff; }
.counter .big.neg { color: #F5A47A; }
.counter .of { font-size: 15px; color: #DCE4F0; }
.counter .goalnum { font-family: var(--display); font-weight: 600; font-size: 44px; line-height: 1; color: #F2B33D; }
.counter .status { font-size: 14px; color: #DCE4F0; margin-top: 8px; }
.counter .status b { color: #fff; }
.shares { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
.share { background: var(--navy-2); border-radius: 8px; padding: 8px 10px; border: 2px solid transparent; text-align: left; color: #fff; }
.share.on { border-color: #F2B33D; }
.share b { font-size: 13px; }
.share span { display: block; font-size: 12px; color: #C9D3E3; }
@media (max-width: 700px) { .counter { grid-template-columns: minmax(0, 1fr); } .shares { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.track { position: relative; height: 16px; background: rgba(255,255,255,.14); border-radius: 8px; }
.track .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--sky); border-radius: 8px; }
.track .pace { position: absolute; top: -5px; bottom: -5px; width: 3px; margin-left: -1px; background: #F2B33D; }
.track.dark { background: var(--soft); height: 10px; }
.track.dark .fill { background: var(--blue); }
.track.dark .pace { background: var(--navy); top: -4px; bottom: -4px; }

/* goal tiles */
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 900px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .tiles { grid-template-columns: minmax(0, 1fr); } }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px 12px; display: grid; gap: 6px; min-width: 0; }
.tile .top { display: flex; align-items: center; gap: 8px; }
.tile .name { font-size: 11.5px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
.tile .state { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; }
.tile .state.met { color: var(--green); }
.tile .state.go { color: var(--red); }
.tile .vrow { display: flex; align-items: flex-end; gap: 12px; }
.tile .vnow, .tile .vgoal { display: grid; }
.tile .vgoal { margin-left: auto; text-align: right; border-left: 2px solid var(--line); padding-left: 12px; }
.tile .cap { font-size: 10.5px; font-weight: 700; letter-spacing: 1.3px; text-transform: uppercase; color: var(--muted); }
.tile .gv { font-family: var(--display); font-weight: 600; font-size: 30px; line-height: 1.05; color: var(--navy); }
.tile .v.short { color: var(--red); }
.tile .v { font-family: var(--display); font-weight: 600; font-size: 38px; line-height: 1.05; color: var(--green); }
.tile .g { font-size: 12.5px; color: var(--muted); }
.scale { position: relative; height: 22px; }
.scale .rail { position: absolute; left: 0; right: 0; top: 10px; height: 3px; background: var(--soft); border-radius: 2px; }
.scale .span { position: absolute; top: 9px; height: 5px; background: var(--blue); border-radius: 3px; }
.scale .then { position: absolute; top: 6px; width: 11px; height: 11px; margin-left: -5px; border-radius: 50%; border: 2px solid var(--faint); background: #fff; }
.scale .now { position: absolute; top: 4px; width: 15px; height: 15px; margin-left: -7px; border-radius: 50%; background: var(--green); border: 2px solid #fff; box-shadow: 0 0 0 1px var(--green); }
.scale .now.short { background: var(--red); box-shadow: 0 0 0 1px var(--red); }
.scale .goal { position: absolute; top: 5px; width: 12px; height: 12px; margin-left: -6px; background: var(--navy); transform: rotate(45deg); }
.scalekey { display: flex; gap: 14px; font-size: 11.5px; color: var(--muted); align-items: center; flex-wrap: wrap; }
.scalekey i { display: inline-block; vertical-align: -1px; margin-right: 4px; }

/* tables */
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th { font-size: 10.5px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
td { padding: 8px 8px; border-bottom: 1px solid var(--soft); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
td .cell { display: inline-flex; align-items: center; gap: 5px; }
tr.goalrow td { color: var(--muted); }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--soft); }
tr.sel td { background: #EAF2FB; }
tr.sel td:first-child { box-shadow: inset 4px 0 0 var(--orange); }
td.name { font-weight: 700; }
td .lad { color: var(--muted); }
td .lad b { color: var(--navy); }

/* charts */
svg { display: block; width: 100%; height: auto; }
.chartkey { display: flex; gap: 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.metric { display: flex; gap: 4px; flex-wrap: wrap; margin: -2px 0 8px; }
.metric button { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 14px; padding: 3px 10px; font-size: 12.5px; font-weight: 600; }
.metric button[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }

/* ladder */
.ladder { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; align-items: center; text-align: center; }
.ladder .rung b { display: block; font-size: 11.5px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
.ladder .rung .pv { font-family: var(--display); font-weight: 600; font-size: 40px; line-height: 1.1; color: var(--navy); display: inline-flex; gap: 8px; align-items: center; }
.ladder .rung span { display: block; font-size: 12px; color: var(--muted); }
.ladder .arrow { color: var(--faint); font-size: 22px; }
@media (max-width: 600px) { .ladder { grid-template-columns: minmax(0, 1fr); } .ladder .arrow { transform: rotate(90deg); } }

.pitcher h3 { font-family: var(--display); font-weight: 600; font-size: 28px; margin: 0; }
.pitcher .who2 { color: var(--muted); margin: 2px 0 10px; }
.mini h4 { font-size: 11.5px; letter-spacing: 1.5px; text-transform: uppercase; margin: 10px 0 2px; color: var(--navy); }
.mini p { margin: 0; font-size: 11.5px; color: var(--muted); }
.pill { margin-left: auto; font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 10px; }
.pill.met { background: #E3F2EA; color: var(--green); }
.pill.go { background: var(--orange-soft); color: var(--orange); }
.pill.wait { background: var(--soft); color: var(--muted); }
.avail-strip { display: flex; align-items: center; gap: 10px 16px; flex-wrap: wrap; padding: 12px 16px; }
.avail-strip > div:first-child { font-size: 14px; }
.avail-strip > div:nth-child(2) { display: flex; gap: 6px; flex-wrap: wrap; }
.avail-strip .mini-btn { margin-left: auto; }
tr.resting td.name { color: var(--muted); }
.back { border: 0; background: transparent; color: var(--blue); font-weight: 600; padding: 0; margin: 0 0 6px; }
.mini-btn { border: 1px solid var(--line); background: var(--card); color: var(--navy); font-weight: 600; font-size: 12.5px; border-radius: 8px; padding: 4px 10px; }
.mini-btn:hover { border-color: var(--navy); }
td.gnote { white-space: normal; min-width: 180px; text-align: left; color: var(--muted); font-size: 12.5px; }
.bars { display: grid; gap: 8px; }
.mbar { display: grid; grid-template-columns: 90px minmax(0, 1fr) 44px; gap: 10px; align-items: center; font-size: 13px; }
.mbar b { text-align: right; font-variant-numeric: tabular-nums; }
.btrack { height: 12px; background: var(--soft); border-radius: 6px; overflow: hidden; }
.btrack div { height: 100%; background: var(--blue); border-radius: 6px; }
.refl { border-top: 1px solid var(--soft); padding: 10px 0; }
.refl:first-of-type { border-top: 0; padding-top: 0; }
.refl .rh { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.refl .rh span { font-size: 12px; color: var(--muted); }
.refl p { margin: 4px 0 0; line-height: 1.5; }
.refl p.empty { color: var(--faint); font-style: italic; }
details.rf > summary { cursor: pointer; list-style: none; }
details.rf > summary::-webkit-details-marker { display: none; }
details.rf > summary::before { content: "▸"; color: var(--muted); font-size: 11px; width: 10px; }
details.rf[open] > summary::before { content: "▾"; }
details.rf .pv { flex: 1 1 200px; min-width: 0; font-style: normal; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
details.rf[open] .pv { display: none; }
details.rf > p { margin-left: 20px; }
details.rmore { border-top: 1px solid var(--soft); padding-top: 10px; }
details.rmore > summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); }
details.rmore[open] > summary { margin-bottom: 4px; }
details.rmore .refl:first-of-type { border-top: 1px solid var(--soft); padding-top: 10px; }
.sheet { background: #fff; border: 2px solid var(--navy); border-radius: 12px; padding: 20px 22px; display: grid; gap: 12px; }
.sheet .sh-top { display: flex; align-items: center; gap: 10px; border-bottom: 2px solid var(--navy); padding-bottom: 8px; }
.sheet .sh-top b { display: block; font-family: var(--display); font-size: 18px; letter-spacing: 1px; text-transform: uppercase; color: var(--navy); }
.sheet .sh-top span { font-size: 12px; color: var(--muted); }
.sheet .sh-btns { margin-left: auto; display: flex; gap: 6px; }
.linkbtn { border: 0; background: transparent; padding: 0; font: inherit; font-weight: 700; color: var(--blue); text-align: left; }
.linkbtn:hover { text-decoration: underline; }
.sheet h3 { font-family: var(--display); font-weight: 600; font-size: 28px; margin: 0; }
.sheet .who2 { margin: 0; color: var(--muted); }
.sheet .card { border-color: var(--soft); }
.cols2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.cols2 h4 { margin: 0 0 4px; font-size: 12px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--navy); }
.cols2 ul { margin: 0; padding-left: 18px; line-height: 1.6; }
@media (max-width: 600px) { .cols2 { grid-template-columns: minmax(0, 1fr); } }
.pg { font-family: var(--display); font-weight: 600; font-size: 18px; letter-spacing: .8px; text-transform: uppercase; color: var(--navy); margin: 6px 0 0; border-bottom: 2px solid var(--soft); padding-bottom: 4px; }
.pg small { font-family: var(--body); font-size: 12px; font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--muted); margin-left: 6px; }
.scards { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
.scard { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 8px; min-width: 0; }
.scard .sh { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.scard .sh b { font-size: 16px; } .scard .sh span { font-size: 12px; color: var(--muted); }
.sstats { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--muted); }
.sstats b { color: var(--ink); }
.mixbar { display: flex; height: 20px; border-radius: 5px; overflow: hidden; }
.mixbar div { color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; white-space: nowrap; overflow: hidden; }
table.sct td, table.sct th { padding: 4px 6px; font-size: 12.5px; }
table.sct td:nth-child(2) { text-align: left; } table.sct th:nth-child(2) { text-align: left; }
.lean { background: var(--orange-soft); color: var(--orange); font-weight: 700; font-size: 11.5px; border-radius: 8px; padding: 1px 7px; }
.mixes { color: var(--faint); font-size: 11.5px; }
.stags { display: flex; flex-wrap: wrap; gap: 4px; }
.stag { font-size: 11px; font-weight: 600; border: 1.5px solid var(--navy); color: var(--navy); border-radius: 8px; padding: 1px 7px; margin-right: 3px; display: inline-block; }
.snote { margin: 0; font-size: 13px; color: var(--orange); font-weight: 600; }
.hnote { color: var(--orange); font-weight: 600; margin-top: 3px; }
table.hit td { vertical-align: top; }
table.hit td, table.hit th { text-align: left; }
table.hit td:first-child { color: var(--muted); }
.write b { font-size: 12px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--navy); }
.write i { display: block; height: 26px; border-bottom: 1px solid var(--line); }
.lines i { display: block; height: 28px; border-bottom: 1px solid var(--line); }
@media print { .bar.gut, .filters, .foot, .titlerow, .stack > section:not(.sheet), .sh-top button { display: none !important; } body { background: #fff; } .sheet { border: 0; padding: 0; } }
.board td.name, .board th:nth-child(3) { text-align: left; }
.board td.rk { font-weight: 800; color: var(--navy); width: 28px; }
.board td.sc { font-weight: 800; color: var(--navy); font-size: 15px; }
.board th small { font-weight: 500; letter-spacing: 0; text-transform: none; }
.mv { font-size: 11.5px; font-weight: 700; color: var(--muted); }
.mv.up { color: var(--green); } .mv.dn { color: var(--red); } .mv.new { color: var(--blue); }
.spick { background: #EAF2FB; border-radius: 10px; padding: 10px 12px; margin: 10px 0 4px; font-size: 13px; }
.spick > span { color: var(--muted); }
.spick div { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; }
.spick label { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; cursor: pointer; }
.spick input { width: 17px; height: 17px; accent-color: var(--navy); margin: 0; }
.pplan { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 10px 0; break-inside: avoid; }
.pplan .sh { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; margin-bottom: 8px; }
.pplan .sh b { font-size: 16px; color: var(--navy); }
.pplan .sh span { font-size: 12.5px; color: var(--muted); }
.pplan .scroll { width: 0; min-width: 100%; }   /* scrolls inside the card instead of widening the page */

   pitches on back-to-back days at different levels combines his pitches on the VARSITY chart. */
function availability(person, asof, forLv) {
  var past = outings(person).filter(function (o) { return o.date < asof; }), last = past[past.length - 1] || null, until = null, why = "", limit = chartFor(forLv).max;
  past.forEach(function (o, i) {
    var prev = past[i - 1], b2b = prev && prev.date === addDays(o.date, -1);
    var swing = b2b && prev.lv.concat(o.lv).filter(function (x, j, a) { return a.indexOf(x) === j; }).length > 1;
    var R = (o.lv.indexOf("Varsity") >= 0 || swing) ? RULES.Varsity : RULES.Sub, rest = restFor(R, o.n), w = o.n + " pitches";
    if (b2b && prev.n <= R.b2b.day1) { rest = Math.max(rest, R.b2b.rest); w = "back-to-back days, " + (prev.n + o.n) + " pitches"; }
    var e = addDays(o.date, rest + 1);
    if (e > asof && (!until || e > until)) { until = e; why = w + " on " + sd(o.date) + " · " + rest + (rest === 1 ? " day" : " days") + " rest"; }
  });
  /* pitched yesterday under the no-rest band: he can go again today, but only up to the 2-day total */
  if (!until && last && last.date === addDays(asof, -1)) {
    var Rl = last.lv.indexOf("Varsity") >= 0 ? RULES.Varsity : chartFor(forLv);
    if (last.n <= Rl.b2b.day1) { limit = Rl.b2b.total - last.n; why = "threw " + last.n + " yesterday · " + Rl.b2b.total + " max over 2 days"; }
  }
  var three = past.filter(function (o) { return o.date >= addDays(asof, -3); }).reduce(function (a, o) { return a + o.n; }, 0);
  return {last: last, until: until, why: why, limit: limit, three: three};
}
function ruleNote(lv) {
  var R = chartFor(lv), name = lv === "Varsity" ? "Varsity" : "Sub-varsity";
  return "<b>CHSAA 2025-26, " + name + " chart:</b> " + R.bands.map(function (b, i) { var hi = i ? R.bands[i - 1][0] - 1 : R.max; return b[0] + "-" + hi + " pitches, " + b[1] + (b[1] === 1 ? " day" : " days") + " rest"; }).join("; ") +
    ". Up to " + R.max + " a day (he may finish the batter). Back-to-back days only if day 1 is " + R.b2b.day1 + " or fewer, " + R.b2b.total + " max over the 2 days, then " + R.b2b.rest + (R.b2b.rest === 1 ? " day" : " days") +
    " rest. A swing arm's pitches combine across levels, on the varsity chart.";
}
function availCard(lv, compact) {
  var asof = S.asof, seen = {};
  var list = lines(lv).filter(function (p) { if (seen[p.person]) return false; seen[p.person] = 1; return true; });
  var rows = list.map(function (p) { return {p: p, a: availability(p.person, asof, lv)}; })
    .sort(function (x, y) { return (x.a.until ? 1 : 0) - (y.a.until ? 1 : 0) || (x.a.three - y.a.three); });
  var ok = rows.filter(function (r) { return !r.a.until; }).length;
  var chips = ASOF_DAYS.map(function (d) { return '<button aria-pressed="' + (d === asof) + '" data-asof="' + d + '">' + sd(d) + "</button>"; }).join("");
  if (compact) {
    return '<section class="card avail-strip"><div><b>' + ok + " of " + rows.length + "</b> arms available " + sd(asof) + "</div><div>" +
      rows.filter(function (r) { return r.a.until; }).map(function (r) { return '<span class="pill go">' + esc(r.p.name) + " · rest, back " + sd(r.a.until) + "</span>"; }).join(" ") +
      '</div><button class="mini-btn" data-tab="teams">Staff availability ›</button></section>';
  }
  var body = rows.map(function (r) {
    var a = r.a, o = a.last, other = o && o.lv.filter(function (x) { return x !== lv; });
    return "<tr" + (a.until ? ' class="resting"' : "") + '><td class="name">' + esc(r.p.name) + (r.p.home ? ' <span class="tag">' + r.p.home + " arm</span>" : "") + "</td><td>" + r.p.t + "</td><td>" +
      (o ? sd(o.date) + " · " + o.n + " pitches" + (other && other.length ? ' <span class="tag">for ' + other.join(", ") + "</span>" : "") : "–") + "</td><td>" + (a.three || "–") + "</td><td>" +
      (a.until ? '<span class="pill go">Rest · back ' + sd(a.until) + "</span>" : '<span class="pill met">Available · up to ' + a.limit + "</span>") + '</td><td class="gnote">' + a.why + "</td></tr>";
  }).join("");
  return '<section class="card"><h2>Who can pitch <small>' + ok + " of " + rows.length + ' available on the day you pick · counts every level he pitched for</small></h2><div class="metric">' + chips + "</div>" +
    '<div class="scroll"><table><tr><th>Pitcher</th><th>T</th><th>Last outing</th><th>Last 3 days</th><th>Status</th><th>Why</th></tr>' + body + "</table></div>" +
    '<p class="note">' + ruleNote(lv) + "</p></section>";
}
/* ======================================================= coach comments: saved to the comments spreadsheet, as the coach */
function saveComment(key) {
  var box = $("#cbox"), msg = $("#cmsg"), k = key.split("|"), text = box ? box.value.trim() : "";
  var say = function (t) { if (msg) msg.textContent = t; };
  if (!(window.google && google.script && google.script.run)) { say("Saving works on the live dashboard only."); return; }
  say("Saving…");
  google.script.run.withSuccessHandler(function (r) {
    COMMENTS = COMMENTS.filter(function (c) { return !(c.id === k[0] && c.lv === k[1] && c.role === (k[2] || "")); });
    if (r && r.text) COMMENTS.push(r);
    S.editing = null; var y = window.scrollY; render(); window.scrollTo(0, y);
  }).withFailureHandler(function (e) { say("Not saved: " + (e && e.message ? e.message : e)); })
    .saveComment({id: k[0], lv: k[1], role: k[2] || "", text: text, player: NAME[k[0]] || ""});
}

function render() {
  if (!tabsFor(S.level).some(function (t) { return t[0] === S.tab; })) S.tab = "overview";
  drawBars(); writeHash();
  var v = S.tab === "board" ? boardPage() : S.tab === "scout" ? scoutPage() : S.tab === "overview" ? overview() : S.tab === "teams" ? teams() : S.tab === "players" ? (S.player ? playerPage(S.player) : playersPage()) : reportsPage();
  $("#view").innerHTML = v + '<p class="foot">' + esc(MODEL.version || "Coaches dashboard") + " · every number from the " + SEASON + " season Sheet" + (MODEL.built ? ", read " + esc(MODEL.built) : "") +
    (MODEL.importUrl ? ' · <a href="' + esc(MODEL.importUrl) + '" target="_top">Import GameChanger stats</a>' : "") + "</p>";
  /* opened from the Hitting side: land on his hitting, even when pitching leads the page */
  if (S.player && S.jumpTo) { var sj = document.getElementById("sec-" + S.jumpTo); if (sj && sj.previousElementSibling) sj.scrollIntoView({block: "start"}); }
  S.jumpTo = null;
  try { localStorage.setItem("tcd-2", JSON.stringify({side: S.side, level: S.level, tab: S.tab, season: S.season, metric: S.metric, hmetric: S.hmetric, cls: S.cls})); } catch (e) {}
}
try { var saved = JSON.parse(localStorage.getItem("tcd-2") || "null"); if (saved) { S.side = saved.side || S.side; S.level = saved.level || S.level; S.tab = saved.tab || S.tab; S.season = saved.season || S.season; S.metric = saved.metric || S.metric; S.hmetric = saved.hmetric || S.hmetric; S.cls = saved.cls || S.cls; } } catch (e) {}

document.addEventListener("click", function (e) {
  var b = e.target.closest("button, tr[data-level], tr[data-pitcher], tr[data-person], tr[data-open], tr[data-cls]");
  if (!b) return;
  if (b.dataset.cedit != null) { S.editing = b.dataset.cedit || null; var y0 = window.scrollY; render(); window.scrollTo(0, y0); var cb = $("#cbox"); if (cb) cb.focus(); return; }
  if (b.dataset.csave) { saveComment(b.dataset.csave); return; }
  if (b.dataset.tab) { S.tab = b.dataset.tab; S.player = null; S.from = null; }
  else if (b.dataset.open) { var po = D.pitchers[b.dataset.open]; if (!po) return; S.from = S.tab === "players" ? null : S.tab; S.player = po.person; S.tab = "players"; S.jumpTo = WIN() ? "pitching" : S.side.toLowerCase(); window.scrollTo(0, 0); }
  else if (b.dataset.person) { S.from = S.tab === "players" ? null : S.tab; S.player = b.dataset.person; S.tab = "players"; S.jumpTo = WIN() ? "pitching" : S.side.toLowerCase(); window.scrollTo(0, 0); }
  else if (b.dataset.pf) S.pfilter = b.dataset.pf;
  else if (b.dataset.jump) { var js = document.getElementById("sec-" + b.dataset.jump); if (js) js.scrollIntoView({block: "start", behavior: "smooth"}); return; }
  else if (b.dataset.back) { S.player = null; if (S.from) { S.tab = S.from; S.from = null; } }
  else if (b.dataset.close) { var list = S.scout ? "scout" : "report"; S.scout = null; S.report = null; render(); var top = document.querySelector(list === "scout" ? "[data-scout]" : "[data-report]"); if (top) top.closest("section").scrollIntoView({block: "start"}); return; }
  else if (b.dataset.scout) { S.scout = S.scout === b.dataset.scout ? null : b.dataset.scout; S.report = null; render(); var sc = document.getElementById("sheet"); if (sc) sc.scrollIntoView({block: "start"}); return; }
  else if (b.dataset.report) { S.scout = null; S.report = S.report === b.dataset.report ? null : b.dataset.report; render(); var sh = document.getElementById("sheet"); if (sh) sh.scrollIntoView({block: "start"}); return; }
  else if (b.dataset.print) { window.print(); return; }
  else if (b.dataset.level) { S.level = b.dataset.level; S.player = null; S.report = null; S.scout = null; if (b.closest("main")) S.tab = "overview"; }   /* a level picked from inside a page opens its Overview */
  else if (b.dataset.goside) { S.from = null; S.side = b.dataset.goside; S.player = b.dataset.who; S.tab = "players"; window.scrollTo(0, 0); }
  else if (b.dataset.cls) { S.cls = b.dataset.cls; S.player = null; if (b.closest("main")) S.tab = "overview"; }
  else if (b.dataset.wk) S.wk = b.dataset.wk;
  else if (b.dataset.side) { S.side = b.dataset.side; S.player = null; S.report = null; }
  else if (b.dataset.season) S.season = b.dataset.season;
  else if (b.dataset.asof) S.asof = b.dataset.asof;
  else if (b.dataset.metric) S.metric = b.dataset.metric;
  else if (b.dataset.hmetric) S.hmetric = b.dataset.hmetric;
  else return;
  S.editing = null;
  render();
});
document.addEventListener("change", function (e) {
  if (e.target.matches("input[data-sp]")) {
    var parts = e.target.getAttribute("data-sp").split("~"), key = parts[0], id = parts[1], a = S.sp[key] || (S.sp[key] = []);
    if (e.target.checked) { if (a.indexOf(id) < 0) a.push(id); } else S.sp[key] = a.filter(function (x) { return x !== id; });
    var y = window.scrollY; render(); window.scrollTo(0, y); return;
  }
  if (e.target.matches("input[data-seeds]")) { S.seeds = e.target.checked; render(); if (S.seeds) { var sd2 = document.querySelector(".seeds"); if (sd2) sd2.closest("section").scrollIntoView({block: "start"}); } }
});
document.addEventListener("keydown", function (e) { if ((e.key === "Enter" || e.key === " ") && e.target.matches("tr[tabindex]")) { e.preventDefault(); e.target.click(); } });
window.addEventListener("hashchange", function () { readHash(); render(); });
readHash();
render();
})();
</script>
