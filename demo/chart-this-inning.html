.num { font-variant-numeric: tabular-nums; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; min-width: 0; }
.lbl { font-size: 12px; font-weight: 800; letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted); }

.ab.done { color: var(--ink); }
.ab .r { font-weight: 800; margin-left: 4px; }

/* the step card */
.step { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 18px; }
@media (max-width: 880px) { .step { grid-template-columns: minmax(0, 1fr); } }

.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.board div { background: var(--soft); border-radius: 10px; padding: 8px 10px; min-width: 0; }
@media (max-width: 520px) { .board { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.board b { display: block; font-family: var(--display); font-weight: 600; font-size: 30px; line-height: 1.1; }
.board span { font-size: 11.5px; font-weight: 800; letter-spacing: 1.3px; text-transform: uppercase; color: var(--muted); }

.taps li::before { counter-increment: tap; content: counter(tap); display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--navy); color: var(--card); font-family: var(--display); font-weight: 600; font-size: 18px; }
.taps li.skip { opacity: .55; }
.taps .k { font-size: 12px; font-weight: 800; letter-spacing: 1.3px; text-transform: uppercase; color: var(--muted); display: block; }

.mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .92em; background: var(--soft); border-radius: 4px; padding: 1px 5px; overflow-wrap: anywhere; }
.scores { width: 100%; border-collapse: collapse; font-size: 18px; }

.step-n { display: inline-flex; align-items: center; gap: 6px; }

.tot { font-family: var(--display); font-weight: 600; font-size: 30px; }

.scroll { overflow-x: auto; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.mini { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 6px 12px; font-weight: 700; }
.scoutcard { display: grid; gap: 10px; border-left: 6px solid var(--blue); }
.scoutread { font-family: var(--display); font-weight: 500; font-size: 30px; line-height: 1.25; margin: 0; }
.scoutnote { font-size: 20px; font-weight: 700; color: var(--orange); margin: 0; line-height: 1.4; }
.stagrow { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.stag { font-family: var(--display); font-weight: 600; font-size: 20px; border: 2px solid var(--navy); color: var(--navy); border-radius: 8px; padding: 1px 10px; }

.foot { color: var(--faint); font-size: 12.5px; margin-top: 16px; }
@media (prefers-reduced-motion: no-preference) { .prog div { transition: width .25s ease; } }
</style>

document.addEventListener("click", function (e) {
  var b = e.target.closest("button"); if (!b) return;
  if (b.dataset.tab) { S.tab = b.dataset.tab; try { history.replaceState(null, "", "#" + S.tab); } catch (x) {} render(); window.scrollTo(0, 0); }
  else if (b.dataset.go) go(+b.dataset.go);
  else if (b.dataset.pt) { var p = b.dataset.pt.split("|"), g = S.groups[+p[0]]; g[p[1]] = Math.max(0, g[p[1]] + (+p[2])); render(); }
  else if (b.dataset.groups) { if (+b.dataset.groups > 0) S.groups.push({name: "Group " + (S.groups.length + 1), r1: 0, r2: 0}); else S.groups.pop(); render(); }
  else if (b.dataset.reset) { S.groups.forEach(function (g) { g.r1 = 0; g.r2 = 0; }); S.i = {pitch: 0, off: 0}; render(); }
});
document.addEventListener("input", function (e) { var i = e.target.dataset.gname; if (i != null) { S.groups[+i].name = e.target.value; save(); } });
document.addEventListener("keydown", function (e) {
  if (e.target.matches("input, textarea")) return;
  if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { e.preventDefault(); go(1); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(-1); }
});
window.addEventListener("hashchange", function () { readHash(); render(); });
readHash(); render();
})();
</script>
